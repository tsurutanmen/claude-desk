<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Claude Desk</title>
<style>
  /* Desktop wallpaper: quiet charcoal desk, one red for warnings. Sessions on the left, usage limits on the right, the voice agent at the bottom. */
  :root {
    --bg: #1c1d1f;
    --ink: #e8e6e1;
    --dim: #8d8b86;
    --faint: #3a3b3e;
    --red: #e5484d;
    --font: "Yu Gothic UI", "Meiryo", "Hiragino Sans", system-ui, sans-serif;
    --mono: "Cascadia Mono", "Consolas", "BIZ UDGothic", monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
  .desk { position: absolute; inset: 0; padding: 5vh 4vw; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); gap: 4vw; box-sizing: border-box; }
  .clock { font-size: 1.1vw; color: var(--dim); letter-spacing: .04em; }
  .clock b { display: block; font-size: 3.4vw; font-weight: 400; color: var(--ink); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  h2 { font-size: .95vw; font-weight: 600; color: var(--dim); margin: 4vh 0 1.4vh; letter-spacing: .08em; }
  .sessions { display: grid; gap: 2vh; max-width: 38vw; }
  .s { border-top: 1px solid var(--faint); padding-top: 1.2vh; }
  .s .top { display: flex; justify-content: space-between; gap: 1vw; font-size: 1.35vw; }
  .s .ago { color: var(--dim); font-size: .85vw; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .s .file { font-family: var(--mono); font-size: 1vw; color: var(--ink); opacity: .85; margin-top: .4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s .prompt { font-size: 1vw; color: var(--dim); margin-top: .3vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s.fresh .top span:first-child::before { content: ""; display: inline-block; width: .5vw; height: .5vw; border-radius: 50%; background: var(--ink); margin-right: .6vw; vertical-align: middle; }
  .right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .limits { margin-top: 4vh; width: 18vw; display: grid; gap: 1.4vh; }
  .limit { font-size: 1vw; }
  .limit .row { display: flex; justify-content: space-between; color: var(--dim); }
  .limit .row b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .limit .line { height: 2px; background: var(--faint); margin-top: .6vh; }
  .limit .line i { display: block; height: 100%; background: var(--ink); }
  .limit.high .line i { background: var(--red); }
  .limit.high .row b { color: var(--red); }
  .today { margin-top: 1.6vh; font-size: 1vw; color: var(--dim); }
  .dotbar { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1.6vh; }
  .dot { width: 3.2vw; height: 3.2vw; border-radius: 50%; background: var(--ink); opacity: .5; transition: opacity .4s, transform .4s; }
  .dot.idle { animation: breathe 6s ease-in-out infinite; }
  .dot.listening { opacity: 1; transform: scale(1.25); background: var(--red); animation: listen 1.1s ease-in-out infinite; }
  .dot.thinking { opacity: .9; animation: think 1.4s linear infinite; background: transparent; border: 3px solid var(--ink); border-right-color: transparent; }
  .dot.replied { opacity: 1; }
  .dot.offline { opacity: .15; animation: none; }
  @keyframes breathe { 50% { opacity: .25; } }
  @keyframes listen { 50% { transform: scale(1.4); } }
  @keyframes think { to { transform: rotate(360deg); } }
  .bubble { max-width: 46vw; font-size: 1.3vw; line-height: 1.7; text-align: center; color: var(--ink); min-height: 1.7em; }
  .bubble .heard { color: var(--dim); display: block; font-size: 1vw; }
  .dotline { font-size: .95vw; color: var(--dim); }
  .off { position: absolute; right: 4vw; bottom: 3vh; font-size: .8vw; color: var(--faint); }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
</style>
</head>
<body>
<div class="desk">
  <section>
    <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
    <h2>セッション</h2>
    <div class="sessions" id="sessions"></div>
  </section>
  <section class="right">
    <div class="limits" id="limits"></div>
    <div class="today" id="today"></div>
  </section>
</div>
<div class="dotbar">
  <div class="bubble" id="bubble"></div>
  <div class="dot idle" id="dot"></div>
  <div class="dotline" id="dotline"></div>
</div>
<div class="off" id="off"></div>
<script src="key.js"></script>
<script>
// key.js is written by server.py beside this page; without the key the server answers 403
const URL_STATE = (new URLSearchParams(location.search).get("state") || "http://127.0.0.1:8795/state")
  + "?k=" + encodeURIComponent(window.DESK_KEY || "");
const $ = id => document.getElementById(id);
let last = null;

function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "秒前";
  if (s < 3600) return Math.round(s / 60) + "分前";
  return Math.round(s / 3600) + "時間前";
}
function base(p) { return (p || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || p || ""; }
function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function clockText(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}

function render(st) {
  const now = Date.now();
  // sessions
  $("sessions").innerHTML = (st.sessions || []).slice(0, 7).map(p => `
    <div class="s ${now - p.at < 60000 ? "fresh" : ""}">
      <div class="top"><span>${esc(base(p.cwd))}</span><span class="ago">${ago(now - p.at)}</span></div>
      ${p.file ? `<div class="file">${esc(p.tool)}　${esc(base(p.file))}</div>` : ""}
      ${p.prompt ? `<div class="prompt">${esc(p.prompt)}</div>` : ""}
    </div>`).join("") || `<div class="s"><div class="prompt">開いているセッションはありません</div></div>`;
  // limits
  $("limits").innerHTML = (st.limits || []).map(l => `
    <div class="limit ${l.percentUsed >= 80 ? "high" : ""}">
      <div class="row"><span>${l.kind === "five_hour" ? "5時間" : l.kind === "seven_day" ? "週" : esc(l.kind)}</span><b>${Math.round(l.percentUsed)}%</b></div>
      <div class="line"><i style="width:${Math.min(100, l.percentUsed)}%"></i></div>
    </div>`).join("");
  $("today").textContent = st.today || "";
  // the dot
  const w = st.wake;
  const d = st.dots && st.dots.self;
  const recent = w && now - w.at < 30000;
  const mode = !d && !w ? "offline" : recent && w.state !== "idle" ? w.state : "idle";
  $("dot").className = "dot " + mode;
  $("bubble").innerHTML = recent && (w.heard || w.reply)
    ? `${w.heard ? `<span class="heard">「${esc(w.heard)}」</span>` : ""}${esc(w.reply || (w.state === "listening" ? "聞いています" : w.state === "thinking" ? "考えています" : ""))}`
    : "";
  $("dotline").textContent = d
    ? [d.name, d.paused ? "休み中" : d.running.length ? `作業中：${d.running[0].title}` : "待機中", d.approvals ? `許可待ち ${d.approvals}` : ""].filter(Boolean).join("　")
    : "";
}

async function poll() {
  try {
    const r = await fetch(URL_STATE, { cache: "no-store" });
    last = await r.json();
    $("off").textContent = "";
  } catch (e) {
    $("off").textContent = "Claude Desk につながっていません";
  }
  if (last) render(last);
}

function tickClock() {
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
}

tickClock(); setInterval(tickClock, 10000);
poll(); setInterval(poll, 2000);
setInterval(() => last && render(last), 1000);
</script>
</body>
</html>
